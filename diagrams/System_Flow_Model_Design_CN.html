<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>室内狗行为与人宠互动识别系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f7f8fa;
      --paper-2: #eef3f8;
      --ink: #152238;
      --muted: #50657a;
      --soft: #75869a;
      --blue: #003d7c;
      --blue-tint: rgba(0, 61, 124, 0.07);
      --gold: #ef7c00;
      --gold-tint: rgba(239, 124, 0, 0.09);
      --rule: rgba(21, 34, 56, 0.13);
      --font-sans: 'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', 'SimSun', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--font-sans);
    }
    .frame { width: min(1280px, 100%); }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--blue);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 8px;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: clamp(28px, 3vw, 38px);
      font-weight: 600;
      line-height: 1.15;
    }
    .subtitle {
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    svg { display: block; width: 100%; min-width: 960px; height: auto; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">SYSTEM ARCHITECTURE · PRS PROJECT</p>
    <h1>系统流程与模型设计</h1>
    <p class="subtitle">以骨架时序建模为核心：双路姿态提取支持狗行为识别与人宠互动识别，音频作为可选增强模态。</p>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dog-system-title dog-system-desc">
      <title id="dog-system-title">室内狗行为与人宠互动识别系统流程与模型设计</title>
      <desc id="dog-system-desc">视频经过目标检测与跟踪后分别提取狗和人体骨架，连续骨架用于狗行为识别和人宠互动识别；同步音频可通过晚期融合增强互动分类，最终输出类别、置信度和时间线。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#50657a"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#ef7c00"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#003d7c"/>
        </marker>
      </defs>

      <rect width="1280" height="720" fill="#f7f8fa"/>

      <!-- Zones -->
      <rect x="40" y="64" width="240" height="520" rx="8" fill="rgba(0,61,124,0.025)" stroke="rgba(0,61,124,0.18)" stroke-width="0.8"/>
      <rect x="56" y="72" width="104" height="20" rx="2" fill="#f7f8fa"/>
      <text x="108" y="87" fill="#003d7c" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">视频预处理</text>

      <rect x="320" y="64" width="416" height="520" rx="8" fill="rgba(0,61,124,0.025)" stroke="rgba(0,61,124,0.18)" stroke-width="0.8"/>
      <rect x="336" y="72" width="128" height="20" rx="2" fill="#f7f8fa"/>
      <text x="400" y="87" fill="#003d7c" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">骨架与音频特征</text>

      <rect x="776" y="64" width="464" height="520" rx="8" fill="rgba(0,61,124,0.025)" stroke="rgba(0,61,124,0.18)" stroke-width="0.8"/>
      <rect x="792" y="72" width="128" height="20" rx="2" fill="#f7f8fa"/>
      <text x="856" y="87" fill="#003d7c" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">时序识别与输出</text>

      <!-- Connectors: primary video path -->
      <line x1="160" y1="232" x2="160" y2="340" stroke="#003d7c" stroke-width="1.4" marker-end="url(#arrow-link)"/>

      <!-- Detection to dog pose -->
      <path d="M 248,368 H 288 Q 296,368 296,360 V 188 Q 296,180 304,180 H 352"
            fill="none" stroke="#50657a" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Detection to human pose -->
      <path d="M 248,400 H 308 Q 316,400 316,392 V 364 Q 316,356 324,356 H 352"
            fill="none" stroke="#50657a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Pose streams to sequence preprocessing -->
      <path d="M 512,180 H 532 Q 540,180 540,188 V 244 Q 540,252 548,252 H 552"
            fill="none" stroke="#003d7c" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 512,356 H 532 Q 540,356 540,348 V 300 Q 540,292 548,292 H 552"
            fill="none" stroke="#003d7c" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Input audio branch -->
      <path d="M 248,212 H 276 Q 284,212 284,220 V 464 Q 284,472 292,472 H 552"
            fill="none" stroke="#75869a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Skeleton sequence to two temporal models -->
      <path d="M 704,248 H 756 Q 764,248 764,240 V 192 Q 764,184 772,184 H 808"
            fill="none" stroke="#003d7c" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <path d="M 704,296 H 740 Q 748,296 748,304 V 396 Q 748,404 756,404 H 808"
            fill="none" stroke="#ef7c00" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Optional audio late fusion -->
      <path d="M 704,472 H 896 Q 904,472 904,464 V 456"
            fill="none" stroke="#75869a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Model outputs -->
      <path d="M 984,184 H 1116 Q 1124,184 1124,192 V 244"
            fill="none" stroke="#003d7c" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <path d="M 984,404 H 1116 Q 1124,404 1124,396 V 356"
            fill="none" stroke="#ef7c00" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Connector labels, with masks and visible gaps -->
      <rect x="176" y="272" width="96" height="18" rx="2" fill="#f7f8fa"/>
      <text x="224" y="286" fill="#003d7c" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">逐帧处理</text>

      <rect x="392" y="252" width="100" height="18" rx="2" fill="#f7f8fa"/>
      <text x="442" y="266" fill="#003d7c" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">关键点序列</text>

      <rect x="788" y="486" width="92" height="18" rx="2" fill="#f7f8fa"/>
      <text x="834" y="500" fill="#75869a" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">晚期融合</text>

      <!-- Nodes: input -->
      <rect x="72" y="160" width="176" height="72" rx="6" fill="#f7f8fa"/>
      <rect x="72" y="160" width="176" height="72" rx="6" fill="rgba(0,61,124,0.07)" stroke="#003d7c" stroke-width="1"/>
      <rect x="84" y="172" width="36" height="14" rx="2" fill="transparent" stroke="rgba(0,61,124,0.45)" stroke-width="0.8"/>
      <text x="102" y="182" fill="#003d7c" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
      <text x="160" y="202" fill="#152238" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">上传室内视频</text>
      <text x="160" y="218" fill="#50657a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">RGB frames · audio</text>

      <!-- Nodes: detection -->
      <rect x="72" y="340" width="176" height="88" rx="6" fill="#f7f8fa"/>
      <rect x="72" y="340" width="176" height="88" rx="6" fill="#ffffff" stroke="#152238" stroke-width="1"/>
      <rect x="84" y="352" width="36" height="14" rx="2" fill="transparent" stroke="rgba(21,34,56,0.42)" stroke-width="0.8"/>
      <text x="102" y="362" fill="#50657a" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">TRACK</text>
      <text x="160" y="380" fill="#152238" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">目标检测与跟踪</text>
      <text x="160" y="398" fill="#50657a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">RTMDet · ByteTrack</text>
      <text x="160" y="416" fill="#50657a" font-size="12" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">人 · 狗 · 食盆 · 玩具</text>

      <!-- Nodes: dog pose -->
      <rect x="352" y="136" width="160" height="88" rx="6" fill="#f7f8fa"/>
      <rect x="352" y="136" width="160" height="88" rx="6" fill="#ffffff" stroke="#003d7c" stroke-width="1"/>
      <rect x="364" y="148" width="32" height="14" rx="2" fill="transparent" stroke="rgba(0,61,124,0.45)" stroke-width="0.8"/>
      <text x="380" y="158" fill="#003d7c" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">POSE</text>
      <text x="432" y="178" fill="#152238" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">狗姿态估计</text>
      <text x="432" y="196" fill="#50657a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">RTMPose-M · 17 keypoints</text>
      <text x="432" y="212" fill="#50657a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">AP-10K → APT-36K → indoor</text>

      <!-- Nodes: human pose -->
      <rect x="352" y="312" width="160" height="88" rx="6" fill="#f7f8fa"/>
      <rect x="352" y="312" width="160" height="88" rx="6" fill="#ffffff" stroke="#003d7c" stroke-width="1"/>
      <rect x="364" y="324" width="32" height="14" rx="2" fill="transparent" stroke="rgba(0,61,124,0.45)" stroke-width="0.8"/>
      <text x="380" y="334" fill="#003d7c" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">POSE</text>
      <text x="432" y="356" fill="#152238" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">人体姿态估计</text>
      <text x="432" y="374" fill="#50657a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">pretrained RTMPose</text>
      <text x="432" y="390" fill="#50657a" font-size="12" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">手腕 · 手肘 · 身体姿态</text>

      <!-- Nodes: sequence -->
      <rect x="552" y="224" width="152" height="96" rx="6" fill="#f7f8fa"/>
      <rect x="552" y="224" width="152" height="96" rx="6" fill="rgba(0,61,124,0.07)" stroke="#003d7c" stroke-width="1.2"/>
      <rect x="564" y="236" width="32" height="14" rx="2" fill="transparent" stroke="rgba(0,61,124,0.45)" stroke-width="0.8"/>
      <text x="580" y="246" fill="#003d7c" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">SEQ</text>
      <text x="628" y="268" fill="#152238" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">骨架序列预处理</text>
      <text x="628" y="286" fill="#50657a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">T × V × (x, y, confidence)</text>
      <text x="628" y="304" fill="#50657a" font-size="12" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">跟踪 · 插值 · 归一化</text>

      <!-- Nodes: audio optional -->
      <rect x="552" y="432" width="152" height="80" rx="6" fill="#f7f8fa"/>
      <rect x="552" y="432" width="152" height="80" rx="6" fill="rgba(21,34,56,0.02)" stroke="rgba(21,34,56,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="564" y="444" width="32" height="14" rx="2" fill="transparent" stroke="rgba(21,34,56,0.28)" stroke-width="0.8"/>
      <text x="580" y="454" fill="#75869a" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">OPT</text>
      <text x="628" y="476" fill="#152238" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">音频特征提取</text>
      <text x="628" y="494" fill="#50657a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">MERT / YAMNet</text>

      <!-- Nodes: dog behavior -->
      <rect x="808" y="136" width="176" height="96" rx="6" fill="#f7f8fa"/>
      <rect x="808" y="136" width="176" height="96" rx="6" fill="#ffffff" stroke="#003d7c" stroke-width="1.2"/>
      <rect x="820" y="148" width="40" height="14" rx="2" fill="transparent" stroke="rgba(0,61,124,0.45)" stroke-width="0.8"/>
      <text x="840" y="158" fill="#003d7c" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">TASK A</text>
      <text x="896" y="180" fill="#152238" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">狗行为识别</text>
      <text x="896" y="198" fill="#50657a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">ST-GCN · LSTM baseline</text>
      <text x="896" y="216" fill="#50657a" font-size="12" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">站 · 坐 · 躺 · 进食 · 玩耍</text>

      <!-- Nodes: interaction focal -->
      <rect x="808" y="352" width="176" height="104" rx="6" fill="#f7f8fa"/>
      <rect x="808" y="352" width="176" height="104" rx="6" fill="rgba(239,124,0,0.09)" stroke="#ef7c00" stroke-width="1.2"/>
      <rect x="820" y="364" width="40" height="14" rx="2" fill="transparent" stroke="rgba(239,124,0,0.55)" stroke-width="0.8"/>
      <text x="840" y="374" fill="#ef7c00" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">TASK B</text>
      <text x="896" y="396" fill="#152238" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">人宠互动识别</text>
      <text x="896" y="414" fill="#50657a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">dual-stream ST-GCN</text>
      <text x="896" y="432" fill="#50657a" font-size="12" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">人体骨架 + 狗骨架</text>
      <text x="896" y="448" fill="#50657a" font-size="12" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">距离 · 速度 · 人狗物关系</text>

      <!-- Nodes: output focal -->
      <rect x="1040" y="244" width="168" height="112" rx="6" fill="#f7f8fa"/>
      <rect x="1040" y="244" width="168" height="112" rx="6" fill="rgba(239,124,0,0.09)" stroke="#ef7c00" stroke-width="1.2"/>
      <rect x="1052" y="256" width="32" height="14" rx="2" fill="transparent" stroke="rgba(239,124,0,0.55)" stroke-width="0.8"/>
      <text x="1068" y="266" fill="#ef7c00" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">OUT</text>
      <text x="1124" y="290" fill="#152238" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">结构化识别结果</text>
      <text x="1124" y="312" fill="#50657a" font-size="12" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">狗行为 · 互动类别</text>
      <text x="1124" y="330" fill="#50657a" font-size="12" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">置信度 · 时间线</text>
      <text x="1124" y="346" fill="#50657a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">JSON / visual report</text>

      <!-- Legend strip -->
      <line x1="40" y1="620" x2="1240" y2="620" stroke="rgba(21,34,56,0.13)" stroke-width="0.8"/>
      <text x="40" y="644" fill="#50657a" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.16em">LEGEND</text>

      <line x1="132" y1="642" x2="172" y2="642" stroke="#003d7c" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <text x="184" y="646" fill="#50657a" font-size="12" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">主要视觉/骨架流程</text>

      <line x1="372" y1="642" x2="412" y2="642" stroke="#75869a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <text x="1240" y="682" fill="#75869a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="end">NUS-INSPIRED ACADEMIC PALETTE · STATIC</text>
    </svg>
  </main>
</body>
</html>
