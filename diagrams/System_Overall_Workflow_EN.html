<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Overall Workflow for Indoor Dog Behavior and Human–Dog Interaction Recognition</title>
  <style>
    :root{--paper:#fbfcfd;--ink:#172238;--muted:#607087;--soft:#8190a3;--rule:#d7e0e9;--navy:#003d7c;--blue:#0a84bd;--orange:#ef7c00;--green:#15936c}
    *{box-sizing:border-box}
    body{margin:0;background:#edf2f6;color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}
    main{width:min(1328px,calc(100vw - 32px));margin:24px auto 40px}
    .figure{margin:0;background:var(--paper);border:1px solid #dce4ec;padding:20px 22px 14px}
    .diagram-container{overflow-x:auto}
    svg{display:block;width:100%;min-width:1280px;height:auto}
    figcaption{margin:12px 4px 0;padding-top:12px;border-top:1px solid #dce4ec;font:14px/1.65 Georgia,"Noto Serif SC",serif;color:#445269}
    .cap{font-weight:700;color:#172238}
    @media print{body{background:#fff}main{width:100%;margin:0}.figure{border:0;padding:0}.diagram-container{overflow:visible}figcaption{font-size:11pt}}
  </style>
</head>
<body>
<main>
  <figure class="figure">
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-overall-en-title system-overall-en-desc">
        <title id="system-overall-en-title">Overall Workflow for Indoor Dog Behavior and Human–Dog Interaction Recognition</title>
        <desc id="system-overall-en-desc">The system comprises offline training and online inference. Training data support dog pose, human pose, dog behavior, and human–dog interaction models; online indoor video passes through detection and tracking, dual-species pose estimation, skeleton-graph construction, and two spatiotemporal graph-convolution tasks to output classes, confidence scores, and timelines.</desc>
        <defs>
          <pattern id="overall-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r=".75" fill="#172238" opacity=".055"/></pattern>
          <marker id="overall-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#607087"/></marker>
          <marker id="overall-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#003d7c"/></marker>
          <marker id="overall-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#ef7c00"/></marker>
          <style>
            .sans{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}.serif{font-family:Georgia,"Noto Serif SC",serif}.mono{font-family:"Geist Mono",Consolas,monospace}
            .zone{fill:#fff;stroke:#d4dee8;stroke-width:1}.zone-label{font-size:10px;font-weight:700;letter-spacing:.12em}.stage{font-size:8px;font-weight:700;letter-spacing:.13em}.title{font-size:13px;font-weight:750;fill:#172238}.sub{font-size:10px;fill:#607087}.micro{font-size:8px;fill:#607087}.tech{font-size:9px;fill:#4f6178}.main-edge{fill:none;stroke:#003d7c;stroke-width:1.55;marker-end:url(#overall-arrow-main)}.edge{fill:none;stroke:#607087;stroke-width:1.15;marker-end:url(#overall-arrow)}.deploy{fill:none;stroke:#8190a3;stroke-width:1.05;stroke-dasharray:5 4;marker-end:url(#overall-arrow)}.accent-edge{fill:none;stroke:#ef7c00;stroke-width:1.45;marker-end:url(#overall-arrow-accent)}
          </style>
        </defs>

        <rect width="1280" height="720" fill="#fbfcfd"/>
        <rect width="1280" height="720" fill="url(#overall-dots)"/>
        <text x="36" y="38" class="serif" font-size="27" font-weight="700" fill="#172238">Overall Workflow for Indoor Dog Behavior and Human–Dog Interaction Recognition</text>
        <text x="37" y="62" class="sans" font-size="11" fill="#607087">Dual-species skeletons provide a shared representation: pose estimation locates joints; ST-GCN models temporal behavior</text>
        <line x1="36" y1="78" x2="1244" y2="78" stroke="#cbd6e1"/>

        <!-- zones -->
        <rect class="zone" x="36" y="100" width="1208" height="116" rx="8" fill="#f7f9fb"/>
        <rect x="52" y="93" width="124" height="18" fill="#fbfcfd"/>
        <text x="58" y="106" class="mono zone-label" fill="#607087">OFFLINE TRAINING</text>

        <rect class="zone" x="36" y="248" width="1208" height="336" rx="8" fill="#ffffff"/>
        <rect x="52" y="241" width="126" height="18" fill="#fbfcfd"/>
        <text x="58" y="254" class="mono zone-label" fill="#003d7c">ONLINE INFERENCE</text>

        <!-- stage headings -->
        <g class="sans">
          <rect x="48" y="270" width="140" height="24" rx="3" fill="#003d7c" opacity=".08"/><text x="118" y="286" class="stage" text-anchor="middle" fill="#003d7c">01 · VIDEO INPUT</text>
          <rect x="224" y="270" width="140" height="24" rx="3" fill="#003d7c" opacity=".08"/><text x="294" y="286" class="stage" text-anchor="middle" fill="#003d7c">02 · SUBJECT LOCALIZATION</text>
          <rect x="404" y="270" width="220" height="24" rx="3" fill="#003d7c" opacity=".08"/><text x="514" y="286" class="stage" text-anchor="middle" fill="#003d7c">03 · DUAL-SPECIES POSE</text>
          <rect x="664" y="270" width="170" height="24" rx="3" fill="#003d7c" opacity=".08"/><text x="749" y="286" class="stage" text-anchor="middle" fill="#003d7c">04 · SKELETON GRAPH</text>
          <rect x="874" y="270" width="170" height="24" rx="3" fill="#ef7c00" opacity=".11"/><text x="959" y="286" class="stage" text-anchor="middle" fill="#a84f00">05 · TEMPORAL RECOGNITION</text>
          <rect x="1080" y="270" width="152" height="24" rx="3" fill="#003d7c" opacity=".08"/><text x="1156" y="286" class="stage" text-anchor="middle" fill="#003d7c">06 · OUTPUT</text>
        </g>

        <!-- connectors are drawn before nodes -->
        <line class="edge" x1="348" y1="158" x2="404" y2="158"/>
        <path class="deploy" d="M514 200V292"/>
        <path class="deploy" d="M936 200V238Q936 246 944 246H952Q960 246 960 254V266"/>

        <line class="main-edge" x1="188" y1="400" x2="224" y2="400"/>
        <line class="main-edge" x1="364" y1="400" x2="404" y2="400"/>
        <line class="main-edge" x1="624" y1="400" x2="664" y2="400"/>
        <path class="main-edge" d="M834 364H850Q858 364 858 356V328Q858 320 866 320H874"/>
        <path class="accent-edge" d="M834 444H850Q858 444 858 452V464Q858 472 866 472H874"/>
        <path class="main-edge" d="M1044 328H1056Q1064 328 1064 336V374Q1064 382 1072 382H1080"/>
        <path class="accent-edge" d="M1044 464H1056Q1064 464 1064 456V430Q1064 422 1072 422H1080"/>

        <!-- offline node 1: data -->
        <g class="sans">
          <rect x="56" y="120" width="292" height="76" rx="6" fill="#fff" stroke="#b7c6d5"/>
          <rect x="68" y="132" width="42" height="15" rx="2" fill="#003d7c" opacity=".10"/><text x="89" y="143" class="mono" font-size="7.5" text-anchor="middle" fill="#003d7c">DATA</text>
          <text x="124" y="143" class="title">Training Data and Labels</text>
          <text x="68" y="164" class="sub">Pose: COCO-17; AP-10K official split → dog subset → indoor data</text>
          <text x="68" y="183" class="sub">Behavior: project clips · dog labels · interaction labels</text>
        </g>

        <!-- offline node 2: training -->
        <g class="sans">
          <rect x="404" y="116" width="620" height="84" rx="6" fill="#fff" stroke="#9fb2c6"/>
          <rect x="416" y="128" width="46" height="15" rx="2" fill="#607087" opacity=".11"/><text x="439" y="139" class="mono" font-size="7.5" text-anchor="middle" fill="#4f6178">TRAIN</text>
          <text x="476" y="139" class="title">Staged Training and Model Selection</text>
          <line x1="614" y1="150" x2="614" y2="188" stroke="#d7e0e9"/><line x1="814" y1="150" x2="814" y2="188" stroke="#d7e0e9"/>
          <text x="420" y="162" class="sub">Dog Pose RTMPose</text><text x="420" y="179" class="mono tech">AP-10K → dog subset → indoor</text>
          <text x="632" y="162" class="sub">Human Pose RTMPose</text><text x="632" y="179" class="mono tech">COCO-17 pretrained</text>
          <text x="832" y="162" class="sub">Temporal Recognition Models</text><text x="832" y="179" class="mono tech">ST-GCN · validation / test</text>
          <text x="1008" y="189" class="mono micro" text-anchor="end">model weights ↓</text>
        </g>

        <!-- online input -->
        <g class="sans">
          <rect x="48" y="324" width="140" height="152" rx="6" fill="#f7fbfe" stroke="#9fb2c6"/>
          <rect x="62" y="340" width="112" height="70" rx="3" fill="#e6eef5"/>
          <circle cx="91" cy="358" r="6" fill="#003d7c"/><path d="M91 366V386M91 374L79 384M91 374L103 384M91 386L84 402M91 386L99 402" stroke="#003d7c" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M118 382L137 376L154 383L151 394L126 395L117 389Z" fill="#ef7c00" opacity=".82"/><path d="M128 394L127 404M147 393L150 404" stroke="#a84f00" stroke-width="2.6" stroke-linecap="round"/>
          <text x="118" y="436" class="title" text-anchor="middle">Indoor RGB Video</text><text x="118" y="455" class="mono tech" text-anchor="middle">frames · timestamps</text>
        </g>

        <!-- detect and track -->
        <g class="sans">
          <rect x="224" y="324" width="140" height="152" rx="6" fill="#fff" stroke="#9fb2c6"/>
          <rect x="240" y="342" width="42" height="18" rx="2" fill="#003d7c" opacity=".10"/><text x="261" y="355" class="mono" font-size="8" text-anchor="middle" fill="#003d7c">DET</text>
          <rect x="306" y="342" width="42" height="18" rx="2" fill="#ef7c00" opacity=".12"/><text x="327" y="355" class="mono" font-size="8" text-anchor="middle" fill="#a84f00">ID</text>
          <path d="M282 351H302" stroke="#607087" marker-end="url(#overall-arrow)"/>
          <text x="294" y="388" class="title" text-anchor="middle" textLength="124" lengthAdjust="spacingAndGlyphs">Detection and Multi-object Tracking</text>
          <text x="294" y="410" class="mono tech" text-anchor="middle">RTMDet / YOLO</text><text x="294" y="428" class="mono tech" text-anchor="middle">ByteTrack / BoT-SORT</text>
          <text x="294" y="454" class="sub" text-anchor="middle">person / dog bbox + ID</text>
        </g>

        <!-- dual-species pose -->
        <g class="sans">
          <rect x="404" y="300" width="220" height="200" rx="6" fill="#fff" stroke="#003d7c" stroke-width="1.25"/>
          <text x="514" y="326" class="title" text-anchor="middle">Dual-Species RTMPose</text><text x="514" y="344" class="mono tech" text-anchor="middle">Top-down · K = 17</text>
          <rect x="420" y="360" width="188" height="52" rx="4" fill="#f4f9fc" stroke="#b7c6d5"/>
          <circle cx="443" cy="379" r="5" fill="#003d7c"/><path d="M443 385V398M443 390L436 396M443 390L450 396M443 398L439 406M443 398L448 406" stroke="#003d7c" stroke-width="2" stroke-linecap="round"/>
          <text x="466" y="381" class="title">Human Branch</text><text x="466" y="399" class="mono tech">COCO-17 keypoints</text>
          <rect x="420" y="426" width="188" height="56" rx="4" fill="#fff8ef" stroke="#d2b999"/>
          <path d="M432 451L445 444L460 448L467 456L462 465L441 464L432 459Z" fill="#ef7c00" opacity=".82"/><path d="M443 464L442 472M459 463L461 472" stroke="#a84f00" stroke-width="2" stroke-linecap="round"/>
          <text x="478" y="450" class="title">Dog Branch</text><text x="478" y="469" class="mono tech">AP-10K 17 keypoints</text>
        </g>

        <!-- graph construction -->
        <g class="sans">
          <rect x="664" y="308" width="170" height="184" rx="6" fill="#f7fbfe" stroke="#003d7c" stroke-width="1.15"/>
          <rect x="680" y="324" width="40" height="16" rx="2" fill="#003d7c" opacity=".10"/><text x="700" y="336" class="mono" font-size="7.5" text-anchor="middle" fill="#003d7c">GRAPH</text>
          <text x="749" y="364" class="title" text-anchor="middle" textLength="148" lengthAdjust="spacingAndGlyphs">Skeleton Sequence and Graph Construction</text>
          <text x="749" y="388" class="mono tech" text-anchor="middle">T × V × (x, y, c)</text>
          <line x1="684" y1="404" x2="814" y2="404" stroke="#d7e0e9"/>
          <text x="684" y="426" class="sub" textLength="134" lengthAdjust="spacingAndGlyphs">• ID alignment and missing-joint interpolation</text><text x="684" y="447" class="sub" textLength="134" lengthAdjust="spacingAndGlyphs">• Centering and scale normalization</text><text x="684" y="468" class="sub" textLength="134" lengthAdjust="spacingAndGlyphs">• Spatial edges + temporal edges + partitions</text>
        </g>

        <!-- task A -->
        <g class="sans">
          <rect x="874" y="296" width="170" height="96" rx="6" fill="#fff" stroke="#9fb2c6"/>
          <rect x="888" y="308" width="44" height="15" rx="2" fill="#003d7c" opacity=".10"/><text x="910" y="319" class="mono" font-size="7.3" text-anchor="middle" fill="#003d7c">TASK A</text>
          <text x="959" y="342" class="title" text-anchor="middle" textLength="144" lengthAdjust="spacingAndGlyphs">Dog Behavior Recognition</text><text x="959" y="362" class="mono tech" text-anchor="middle">dog skeleton · ST-GCN</text><text x="959" y="380" class="sub" text-anchor="middle">stand / sit / lie / eat / play…</text>
        </g>

        <!-- task B focal -->
        <g class="sans">
          <rect x="874" y="424" width="170" height="112" rx="6" fill="#fff8ef" stroke="#ef7c00" stroke-width="1.35"/>
          <rect x="888" y="436" width="44" height="15" rx="2" fill="#ef7c00" opacity=".14"/><text x="910" y="447" class="mono" font-size="7.3" text-anchor="middle" fill="#a84f00">TASK B</text>
          <text x="959" y="470" class="title" text-anchor="middle" textLength="146" lengthAdjust="spacingAndGlyphs">Human–Dog Interaction Recognition</text><text x="959" y="490" class="mono tech" text-anchor="middle">dual-stream ST-GCN</text><text x="959" y="508" class="sub" text-anchor="middle" textLength="144" lengthAdjust="spacingAndGlyphs">Human skeleton + dog skeleton</text><text x="959" y="525" class="sub" text-anchor="middle" textLength="148" lengthAdjust="spacingAndGlyphs">distance · relative displacement · velocity</text>
        </g>

        <!-- output -->
        <g class="sans">
          <rect x="1080" y="330" width="152" height="152" rx="6" fill="#f7fbfe" stroke="#003d7c" stroke-width="1.25"/>
          <rect x="1094" y="344" width="38" height="15" rx="2" fill="#003d7c" opacity=".10"/><text x="1113" y="355" class="mono" font-size="7.3" text-anchor="middle" fill="#003d7c">OUT</text>
          <text x="1156" y="382" class="title" text-anchor="middle" textLength="126" lengthAdjust="spacingAndGlyphs">Structured Recognition Output</text>
          <text x="1096" y="408" class="sub">• Dog behavior class</text><text x="1096" y="429" class="sub">• Interaction class</text><text x="1096" y="450" class="sub" textLength="120" lengthAdjust="spacingAndGlyphs">• Confidence and time segments</text>
          <text x="1156" y="470" class="mono micro" text-anchor="middle">JSON / timeline / overlay</text>
        </g>

        <!-- evaluation and legend strip -->
        <line x1="36" y1="616" x2="1244" y2="616" stroke="#cbd6e1"/>
        <text x="36" y="640" class="mono stage" fill="#607087">EVALUATION</text>
        <rect x="132" y="627" width="214" height="24" rx="3" fill="#003d7c" opacity=".07"/><text x="239" y="643" class="sans" font-size="10" text-anchor="middle" fill="#4f6178">Pose: AP / PCK · per-species evaluation</text>
        <rect x="362" y="627" width="228" height="24" rx="3" fill="#003d7c" opacity=".07"/><text x="476" y="643" class="sans" font-size="10" text-anchor="middle" fill="#4f6178">Recognition: Accuracy / Macro-F1</text>
        <rect x="606" y="627" width="258" height="24" rx="3" fill="#ef7c00" opacity=".09"/><text x="735" y="643" class="sans" font-size="10" text-anchor="middle" fill="#76502d">Ablation: single vs dual stream · relation features</text>

        <line x1="900" y1="639" x2="936" y2="639" stroke="#003d7c" stroke-width="1.5" marker-end="url(#overall-arrow-main)"/><text x="948" y="643" class="sans" font-size="10" fill="#607087">Online Main Path</text>
        <line x1="1060" y1="639" x2="1096" y2="639" stroke="#8190a3" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#overall-arrow)"/><text x="1108" y="643" class="sans" font-size="10" fill="#607087">Weight Deployment</text>

        <text x="36" y="682" class="serif" font-size="13" font-style="italic" fill="#607087" textLength="930" lengthAdjust="spacingAndGlyphs">Design principle: detection and pose estimation provide spatial localization; skeleton graphs unify human and dog representations; the two ST-GCN tasks share the front end but are optimized independently.</text>
        <text x="1244" y="682" class="mono micro" text-anchor="end">PROJECT-SPECIFIC REDRAW · COCO-17 + AP-10K-17</text>
      </svg>
    </div>
    <figcaption><span class="cap">Figure: Overall workflow for indoor dog behavior and human–dog interaction recognition.</span> Offline training is shown above and online inference below. Project video is detected and tracked before entering the COCO-17 human-pose branch and AP-10K 17-keypoint dog-pose branch. Aligned skeleton sequences support dog-behavior ST-GCN and dual-stream human–dog interaction ST-GCN, producing classes, confidence scores, and timelines.</figcaption>
  </figure>
</main>
</body>
</html>
