<figcaption><span class="cap">图：修订后的项目数据准备与标注流程。</span> 第一阶段直接加载 AP-10K 预训练的 RTMPose-M 权重；第二阶段从 APT-36K 训练集中筛选犬类数据进行专门化训练；第三阶段使用项目室内数据继续微调。项目视频先按犬只与完整原始视频建立 Group ID 和数据划分，再分别进行帧级姿态标注、片段级行为与互动标注。人体关键点、物体框和音频属于自动派生特征，不与人工主标签混合。</figcaption>
