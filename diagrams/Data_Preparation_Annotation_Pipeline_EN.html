<figcaption><span class="cap">Figure: Revised project data preparation and annotation pipeline.</span> Stage 1 loads AP-10K-pretrained RTMPose-M weights; Stage 2 specializes on dog data from the APT-36K training split; Stage 3 continues fine-tuning on project indoor data. Project videos are assigned group IDs and data splits by dog identity and complete source video before frame-level pose annotation and clip-level behavior and interaction annotation. Human keypoints, object boxes, and audio are derived features rather than manual primary labels.</figcaption>
