ettle;\n      if (k === 0) {\n        z = 100;\n        y = stage === 'out' ? -150 : dragY \u003c 0 ? Math.max(-130, dragY) : Math.min(20, dragY * 0.2);\n        if (stage === 'out') transition = 'transform 160ms ease-in';\n      } else if (stage === 'in' && k === n - 1) {\n        // the previous card rises from behind the stack before sliding to the front\n        y = -150; z = 1; transition = 'transform 200ms ease-out';\n      } else {\n        const d = Math.min(k - p, 2);\n        y = d * 12; s = 1 - d * 0.05;\n        if (k > 2) opacity = 0;\n      }\n      return { ...c, chipBg: interactionChip[c.interaction], transform: 'translateY(' + y + 'px) scale(' + s + ')', opacity, z, transition, hidden: k === 0 ? 'false' : 'true' };\n    });\n    const run = (dir) => {\n      if (n \u003c 2 || this.busy) { this.setState({ dragging: false, dragY: 0 }); return; }\n      this.busy = true;\n      this.setState({ stage: dir > 0 ? 'out' : 'in', dragging: false, dragY: dir > 0 ? this.state.dragY : 0 });\n      setTimeout(() => {\n        this.setState({ stage: null, dragY: 0, index: (index + dir + n) % n });\n        this.busy = false;\n      }, dir > 0 ? 160 : 200);\n    };\n\n    const filters = [['all', 'All'], ['alone', 'Alone'], ['together', 'With you']].map(([id, label]) => ({\n      label,\n      count: all.filter(tests[id]).length,\n      pressed: filter === id ? 'true' : 'false',\n      bg: filter === id ? '#19384a' : '#fffdf8',\n      fg: filter === id ? '#fff8e9' : '#19384a',\n      pick: () => this.setState({ filter: id, index: 0, dragY: 0 })\n    }));\n\n    const current = list[index];\n    const marks = all.map((c) => {\n      const on = current && current.id === c.id;\n      return {\n        label: 'Jump to ' + c.time + ' ' + c.behaviour,\n        pos: ((c.mins - 480) / 720 * 100).toFixed(1) + '%',\n        color: behaviourColor[c.behaviour],\n        w: on ? '14px' : '10px',\n        h: on ? '24px' : '14px',\n        ring: on ? '0 0 0 2px #19384a' : 'none',\n        jump: () => this.setState({ filter: 'all', index: all.indexOf(c), dragY: 0 })\n      };\n    });\n\n    return {\n      clips, filters, marks,\n      position: n ? (index + 1) + ' / ' + n : '0 / 0',\n      prev: () => run(-1),\n      next: () => run(1),\n      stop: (e) => e.stopPropagation(),\n      down: (e) => {\n        this.startY = e.clientY;\n        this.dy = 0;\n        if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);\n        this.setState({ dragging: true, dragY: 0 });\n      },\n      move: (e) => {\n        if (!this.state.dragging) return;\n        this.dy = e.clientY - this.startY; // read on release, before React has flushed the last move\n        this.setState({ dragY: this.dy });\n      },\n      up: () => {\n        if (!this.state.dragging) return;\n        const dy = this.dy || 0;\n        if (dy \u003c -50) run(1); else if (dy > 50) run(-1); else go(index);\n      },\n      wheel: (e) => {\n        if (this.wheelLock || Math.abs(e.deltaY) \u003c 20) return;\n        this.wheelLock = true;\n        setTimeout(() => { this.wheelLock = false; }, 450);\n        run(e.deltaY > 0 ? 1 : -1);\n      }\n    };\n  }\n}\n"},"Result.dc.html":{"html":"\n\n\u003cdiv style=\"width: 390px; height: 844px; box-sizing: border-box; background: #fff8e9; color: #19384a; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden\">\n  \u003cdiv style=\"flex: 1; padding: 20px 18px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden\">\n    \u003cheader style=\"display: flex; align-items: center; gap: 8px\">\n      \u003ca href=\"Main.dc.html\" aria-label=\"Back to story\" style=\"width: 44px; height: 44px; border-radius: 50%; background: #fffdf8; border: 1px solid #d9ddcf; display: grid; place-items: center; box-sizing: border-box\">\n        \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" str x; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #b8402e\">\n      \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 5h16v14H4z\">\u003c/path>\u003cpath d=\"M8 9h8M8 13h5\">\u003c/path>\u003c/svg>Story\n    \u003c/a>\n    \u003ca href=\"Upload.dc.html\" style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px\">\n      \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 16V4M7 9l5-5 5 5\">\u003c/path>\u003cpath d=\"M4 16v4h16v-4\">\u003c/path>\u003c/svg>Upload\n    \u003c/a>\n    \u003ca href=\"Week.dc.html\" style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px\">\n      \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 20V11M12 20V5M19 20v-7\">\u003c/path>\u003c/svg>Week\n    \u003c/a>\n  \u003c/nav>\n\u003c/div>\n","code":"\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { skeleton: true };\n  }\n  renderVals() {\n    const on = this.state.skeleton;\n    const top = { bg: '#ffd45c', fg: '#19384a' };\n    const rest = { bg: '#2b4f63', fg: '#fff8e9' };\n    return {\n      showSkeleton: on,\n      pressed: on ? 'true' : 'false',\n      toggleLabel: on ? 'Skeleton on' : 'Skeleton off',\n      toggle: () => this.setState({ skeleton: !on }),\n      // example scores for the demo clip\n      behaviours: [\n        { name: 'Eating/drinking', pct: '81%', color: '#d9503c' },\n        { name: 'Standing', pct: '11%', color: '#6dc8c6' },\n        { name: 'Walking/run', pct: '4%', color: '#ffd45c' },\n        { name: 'Sitting', pct: '3%', color: '#8fa8e0' },\n        { name: 'Lying/sleep', pct: '1%', color: '#9cc59a' }\n      ],\n      interactions: [\n        { ...top, name: 'Feeding', pct: '72%' },\n        { ...rest, name: 'Petting', pct: '12%' },\n        { ...rest, name: 'Gaming', pct: '8%' },\n        { ...rest, name: 'Quiet together', pct: '5%' },\n        { ...rest, name: 'None', pct: '3%' }\n      ]\n    };\n  }\n}\n"},"Upload.dc.html":{"html":"\n\n\u003cdiv style=\"width: 390px; height: 844px; box-sizing: border-box; background: #fff8e9; color: #19384a; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden\">\n  \u003cdiv style=\"flex: 1; padding: 24px 18px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden\">\n    \u003cheader style=\"display: flex; align-items: center; justify-content: space-between\">\n      \u003cdiv style=\"font-weight: 900; font-size: 14px; letter-spacing: 0.06em\">UPLOAD A CLIP\u003c/div>\n      \u003cspan style=\"display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; background: #fffdf8; border: 1px solid #d9ddcf; border-radius: 99px; padding: 6px 10px\">\n        \u003ci style=\"width: 8px; height: 8px; border-radius: 50%; background: #8a969c\">\u003c/i>No camera linked\n      \u003c/span>\n    \u003c/header>\n\n    \u003csection>\n      \u003cdiv style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; font-size: 10px; letter-spacing: 0.12em; color: #b8402e\">MANUAL MODE\u003c/div>\n      \u003ch1 style=\"margin: 6px 0 4px; font-weight: 900; font-size: 30px; line-height: 1.05; letter-spacing: -0.03em\">Bring your own\u003cbr>footage\u003c/h1>\n      \u003cp style=\"margin: 0; font-size: 12px; line-height: 1.5; color: #4f6470\">A linked camera streams clips here on its own. Until then, upload a video and it runs through the same analysis.\u003c/p>\n    \u003c/section>\n\n    \u003clabel for=\"clip\" style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 124px; background: #fffdf8; border: 2px dashed #6dc8c6; border-radius: 20px; padding: 14px; cursor: pointer; text-align: center\">\n      \u003cspan style=\"width: 44px; height: 44px; border-radius: 14px; background: #ffd45c; display: grid; place-items: center\">\n        \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"#19384a\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 16V4M7 9l5-5 5 5\">\u003c/path>\u003cpath d=\"M4 16v4h16v-4\">\u003c/path>\u003c/svg>\n      \u003c/span>\n      \u003cb style=\"font-size: 14px\">{{fileLabel}}\u003c/b>\n      \u003cspan style=\"font-size: 11px; color: #4f6470\">{{fileHint}}\u003c/span>\n    \u003c/label>\n    \u003cinput id=\"clip\" type=\"file\" accept=\"video/*\" onChange=\"{{pickFile}}\" style=\"position: absolute; width: 1px; height: 1px; opacity: 0\">\n\n    \u003cfieldset style=\"margin: 0; border: 1px solid #d9ddcf; border-radius: 20px; background: #fffdf8; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px\">\n      \u003clegend style=\"padding: 0 6px; font-size: 10px; font-weight: 900; letter-spacing: 0.1em; color: #4f6470\">WHEN WAS IT RECORDED?\u003c/legend>\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n        \u003clabel style=\"display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 800\">Date\n          \u003cinput type=\"date\" value=\"{{date}}\" onChange=\"{{setDate}}\" style=\"height: 44px; box-sizing: border-box; border: 1px solid #c9cfc2; border-radius: 12px; padding: 0 10px; font-family: inherit; font-size: 14px; color: #19384a; background: #fff8e9\">\n        \u003c/label>\n        \u003clabel style=\"display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 800\">Start time\n          \u003cinput type=\"time\" value=\"{{time}}\" onChange=\"{{setTime}}\" style=\"height: 44px; box-sizing: border-box; border: 1px solid #c9cfc2; border-radius: 12px; padding: 0 10px; font-family: inherit; font-size: 14px; color: #19384a; background: #fff8e9\">\n        \u003c/label>\n      \u003c/div>\n      \u003cp style=\"margin: 0; font-size: 11px; line-height: 1.45; color: #4f6470\">Filled in from the video's creation time when it has one. This places the clip in the daily story and the weekly report.\u003c/p>\n    \u003c/fieldset>\n\n    \u003clabel style=\"display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 800\">Which camera would have seen it?\n      \u003cselect style=\"height: 44px; border: 1px solid #c9cfc2; border-radius: 12px; padding: 0 10px; font-family: inherit; font-size: 14px; color: #19384a; background: #fffdf8\">\n        \u003coption>Living room\u003c/option>\n        \u003coption>Kitchen\u003c/option>\n        \u003coption>Bedroom\u003c/option>\n        \u003coption>Garden\u003c/option>\n      \u003c/select>\n    \u003c/label>\n\n    \u003ca href=\"Analyze.dc.html\" style=\"margin-top: auto; margin-bottom: 16px; height: 52px; border-radius: 16px; background: #19384a; color: #fff8e9; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px\">Start analysis\u003c/a>\n  \u003c/div>\n\n  \u003cnav aria-label=\"Main\" style=\"height: 72px; background: #fffdf8; border-top: 1px solid #d9ddcf; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); font-size: 11px; font-weight: 800\">\n    \u003ca href=\"Main.dc.html\" style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px\">\n      \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 5h16v14H4z\">\u003c/path>\u003cpath d=\"M8 9h8M8 13h5\">\u003c/path>\u003c/svg>Story\n    \u003c/a>\n    \u003ca href=\"Upload.dc.html\" aria-current=\"page\" style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #b8402e\">\n      \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 16V4M7 9l5-5 5 5\">\u003c/path>\u003cpath d=\"M4 16v4h16v-4\">\u003c/path>\u003c/svg>Upload\n    \u003c/a>\n    \u003ca href=\"Week.dc.html\" style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px\">\n      \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 20V11M12 20V5M19 20v-7\">\u003c/path>\u003c/svg>Week\n    \u003c/a>\n  \u003c/nav>\n\u003c/div>\n","code":"\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { file: null, date: '2026-10-22', time: '09:08' };\n  }\n  renderVals() {\n    const f = this.state.file;\n    return {\n      fileLabel: f ? f.name : 'Choose a video',\n      fileHint: f ? 'Tap to pick a different one' : 'MP4 or MOV · one dog, up to 5 min',\n      date: this.state.date,\n      time: this.state.time,\n      pickFile: (e) => {\n        const file = e.target.files && e.target.files[0];\n        if (!file) return;\n        const t = new Date(file.lastModified); // shortcut: lastModified stands in for the recording time; the real app reads the video's creation metadata\n        const pad = (n) => String(n).padStart(2, '0');\n        this.setState({ file: { name: file.name }, date: t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()), time: pad(t.getHours()) + ':' + pad(t.getMinutes()) });\n      },\n      setDate: (e) => this.setState({ date: e.target.value }),\n      setTime: (e) => this.setState({ time: e.target.value })\n    };\n  }\n}\n"},"Week.dc.html":{"html":"\n\n\u003cdiv style=\"width: 390px; height: 844px; box-sizing: border-box; background: #fff8e9; color: #19384a; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden\">\n  \u003cdiv style=\"flex: 1; padding: 24px 18px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden\">\n    \u003cheader style=\"display: flex; align-items: center; justify-content: space-between\">\n      \u003cdiv style=\"font-weight: 900; font-size: 14px; letter-spacing: 0.06em\">MILO'S WEEK\u003c/div>\n      \u003cspan style=\"font-size: 11px; font-weight: 800; background: #fffdf8; border: 1px solid #d9ddcf; border-radius: 99px; padding: 6px 10px\">Oct 16–22\u003c/span>\n    \u003c/header>\n\n    \u003csection>\n      \u003cdiv style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; font-size: 10px; letter-spacing: 0.12em; color: #b8402e\">WEEKLY ROUND-UP\u003c/div>\n      \u003ch1 style=\"margin: 6px 0 4px; font-weight: 900; font-size: 32px; line-height: 1.04; letter-spacing: -0.03em\">A sleepy week\u003cbr>with one big walk\u003c/h1>\n      \u003cp style=\"margin: 0; font-size: 12px; color: #4f6470\">[N] clips · minutes per day, placed by recording time\u003c/p>\n    \u003c/section>\n\n    \u003cdiv style=\"background: #fffdf8; border: 1px solid #d9ddcf; border-radius: 20px; padding: 14px\">\n      \u003cdiv role=\"img\" aria-label=\"Stacked daily minutes per behaviour, Monday to Sunday\" style=\"display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 150px\">\n        \u003csc-for list=\"{{days}}\" as=\"d\" hint-placeholder-count=\"7\">\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 2px; align-items: stretch\">\n            \u003cspan style=\"height: {{d.walk}}; background: #ffd45c; border-radius: 6px 6px 2px 2px\">\u003c/span>\n            \u003cspan style=\"height: {{d.eat}}; background: #d9503c; border-radius: 2px\">\u003c/span>\n            \u003cspan style=\"height: {{d.stand}}; background: #6dc8c6; border-radius: 2px\">\u003c/span>\n            \u003cspan style=\"height: {{d.sit}}; background: #8fa8e0; border-radius: 2px\">\u003c/span>\n            \u003cspan style=\"height: {{d.lie}}; background: #9cc59a; border-radius: 2px 2px 6px 6px\">\u003c/span>\n          \u003c/div>\n        \u003c/sc-for>\n      \u003c/div>\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 6px; text-align: center; font-size: 10px; font-weight: 800; color: #4f6470\">\n        \u003cspan>M\u003c/span>\u003cspan>T\u003c/span>\u003cspan>W\u003c/span>\u003cspan>T\u003c/span>\u003cspan>F\u003c/span>\u003cspan>S\u003c/span>\u003cspan>S\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 10px; font-weight: 800\">\n        \u003cspan style=\"display: flex; align-items: center; gap: 4px\">\u003ci style=\"width: 10px; height: 10px; border-radius: 3px; background: #ffd45c\">\u003c/i>Walk/run\u003c/span>\n        \u003cspan style=\"display: flex; align-items: center; gap: 4px\">\u003ci style=\"width: 10px; height: 10px; border-radius: 3px; background: #d9503c\">\u003c/i>Eat/drink\u003c/span>\n        \u003cspan style=\"display: flex; align-items: center; gap: 4px\">\u003ci style=\"width: 10px; height: 10px; border-radius: 3px; background: #6dc8c6\">\u003c/i>Stand\u003c/span>\n        \u003cspan style=\"display: flex; align-items: center; gap: 4px\">\u003ci style=\"width: 10px; height: 10px; border-radius: 3px; background: #8fa8e0\">\u003c/i>Sit\u003c/span>\n        \u003cspan style=\"display: flex; align-items: center; gap: 4px\">\u003ci style=\"width: 10px; height: 10px; border-radius: 3px; background: #9cc59a\">\u003c/i>Lie/sleep\u003c/span>\n      \u003c/div>\n    \u003c/div>\n\n    \u003csection aria-label=\"How the app reads Milo\" style=\"background: #19384a; color: #fff8e9; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px\">\n      \u003cdiv style=\"font-size: 10px; font-weight: 900; letter-spacing: 0.1em; color: #c9d6dc\">HOW SURE ARE WE?\u003c/div>\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n        \u003cdiv style=\"background: #2b4f63; border-radius: 14px; padding: 10px\">\n          \u003cspan style=\"font-size: 11px; font-weight: 800; color: #c9d6dc\">Behaviour\u003c/span>\n          \u003cstrong style=\"display: block; font-size: 26px; font-weight: 900\">78.8%\u003c/strong>\n          \u003cspan style=\"font-size: 10px; color: #c9d6dc\">accuracy · 33 test clips\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"background: #2b4f63; border-radius: 14px; padding: 10px\">\n          \u003cspan style=\"font-size: 11px; font-weight: 800; color: #c9d6dc\">Interaction\u003c/span>\n          \u003cstrong style=\"display: block; font-size: 26px; font-weight: 900\">[ACC]%\u003c/strong>\n          \u003cspan style=\"font-size: 10px; color: #c9d6dc\">5-class model · [N] test clips\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cp style=\"margin: 0; font-size: 11px; line-height: 1.5; color: #c9d6dc\">Skeleton-only: video stays on your camera, only 17 body points per frame are read.\u003c/p>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cnav aria-label=\"Main\" style=\"height: 72px; background: #fffdf8; border-top: 1px solid #d9ddcf; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); font-size: 11px; font-weight: 800\">\n    \u003ca href=\"Main.dc.html\" style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px\">\n      \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 5h16v14H4z\">\u003c/path>\u003cpath d=\"M8 9h8M8 13h5\">\u003c/path>\u003c/svg>Story\n    \u003c/a>\n    \u003ca href=\"Upload.dc.html\" style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px\">\n      \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 16V4M7 9l5-5 5 5\">\u003c/path>\u003cpath d=\"M4 16v4h16v-4\">\u003c/path>\u003c/svg>Upload\n    \u003c/a>\n    \u003ca href=\"Week.dc.html\" aria-current=\"page\" style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #b8402e\">\n      \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 20V11M12 20V5M19 20v-7\">\u003c/path>\u003c/svg>Week\n    \u003c/a>\n  \u003c/nav>\n\u003c/div>\n","code":"\nclass Component extends DCLogic {\n  renderVals() {\n    // placeholder minutes for the mockup; replace with real per-day totals\n    const rows = [[8,6,14,10,60],[12,5,10,14,52],[6,7,18,8,64],[10,6,12,16,48],[14,5,10,10,56],[30,8,16,12,40],[9,7,12,10,58]];\n    const px = (m) => Math.round(m * 1.2) + 'px';\n    return {\n      days: rows.map(([walk, eat, stand, sit, lie]) => ({ walk: px(walk), eat: px(eat), stand: px(stand), sit: px(sit), lie: px(lie) }))\n    };\n  }\n}\n"}};</script>
<script>
// Minimal local runtime for the .dc.html screens exported from the Design canvas.
// shortcut: supports only what these screens use ({{holes}}, sc-for, sc-if, on* events, DCLogic); swap for the canvas runtime if screens grow.
document.write(
  '<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"><\/script>' +
  '<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"><\/script>'
);

document.addEventListener('DOMContentLoaded', () => {
  const h = React.createElement;
  const host = document.querySelector('x-dc');
  const helmet = host.querySelector('helmet');
  if (helmet) { [...helmet.children].forEach((el) => document.head.appendChild(el)); helmet.remove(); }
  // build.mjs sets window.DC_SCREENS to bundle every screen into one page
  const bundled = window.DC_SCREENS;
  const screens = bundled || {
    [decodeURIComponent(location.pathname.split('/').pop())]: {
      html: host.innerHTML,
      code: document.querySelector('script[data-dc-script]').textContent
    }
  };
  const page = document.createElement('style');
  page.textContent = 'html{background:#e9e4d8}body{display:flex;justify-content:center;padding:24px 0}';
  document.head.appendChild(page);

  // HTML lowercases attribute names, so map the event attributes back to React's names
  const EVENTS = ['onClick', 'onChange', 'onPointerDown', 'onPointerMove', 'onPointerUp', 'onPointerCancel',
    'onPointerLeave', 'onLostPointerCapture', 'onWheel'];
  const eventName = Object.fromEntries(EVENTS.map((e) => [e.toLowerCase(), e]));
  const camel = (s) => s.replace(/-([a-z])/g, (_, c) => c.toUpperCase());

  const lookup = (path, scope) => {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce((v, k) => (v == null ? v : v[k]), scope);
  };
  const interp = (str, scope) => {
    const whole = str.match(/^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/);
    if (whole) return lookup(whole[1], scope);
    return str.replace(/\{\{\s*([\w.$]+)\s*\}\}/g, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });
  };
  const styleObj = (css) => {
    const out = {};
    css.split(';').forEach((decl) => {
      const i = decl.indexOf(':');
      if (i < 0) return;
      const prop = decl.slice(0, i).trim();
      out[prop.startsWith('--') ? prop : camel(prop)] = decl.slice(i + 1).trim();
    });
    return out;
  };

  const kids = (node, scope) => [...node.childNodes].map((c, i) => build(c, scope, i));
  function build(node, scope, key) {
    if (node.nodeType === 3) return interp(node.textContent, scope);
    if (node.nodeType !== 1) return null;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const list = lookup(node.getAttribute('list').replace(/[{}\s]/g, ''), scope) || [];
      const as = node.getAttribute('as');
      return h(React.Fragment, { key }, list.map((item, i) =>
        h(React.Fragment, { key: i }, kids(node, { ...scope, [as]: item, $index: i }))));
    }
    if (tag === 'sc-if') {
      return interp(node.getAttribute('value'), scope) ? h(React.Fragment, { key }, kids(node, scope)) : null;
    }
    const props = { key };
    for (const { name, value } of node.attributes) {
      const v = interp(value, scope);
      if (eventName[name]) props[eventName[name]] = v;
      else if (name === 'style') props.style = styleObj(String(v));
      else if (name === 'class') props.className = v;
      else if (name === 'for') props.htmlFor = v;
      else if (tag === 'svg' && !name.startsWith('aria-')) props[camel(name)] = v;
      else props[name] = v;
    }
    // icons and the skeleton overlay are static SVG: render their insides as-is
    if (tag === 'svg') return h('svg', { ...props, dangerouslySetInnerHTML: { __html: node.innerHTML } });
    return h(tag, props, ...(node.childNodes.length ? kids(node, scope) : []));
  }

  const components = {};
  for (const [name, { html, code }] of Object.entries(screens)) {
    const tpl = document.createElement('template');
    tpl.innerHTML = html;
    const template = tpl.content;
    class DCLogic extends React.Component {
      render() { return h(React.Fragment, null, kids(template, this.renderVals())); }
    }
    components[name] = new Function('DCLogic', code + '\nreturn Component;')(DCLogic);
  }
  const names = Object.keys(components);
  const current = () => {
    const name = decodeURIComponent(location.hash.slice(1));
    return components[name] ? name : names.includes('Main.dc.html') ? 'Main.dc.html' : names[0];
  };

  host.replaceWith(Object.assign(document.createElement('div'), { id: 'root' }));
  const root = ReactDOM.createRoot(document.getElementById('root'));
  const show = () => { const name = current(); root.render(h(components[name], { key: name })); };
  if (bundled) {
    // links between screens switch screens inside this one page
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href$=".dc.html"]');
      if (!a) return;
      e.preventDefault();
      location.hash = a.getAttribute('href');
      window.scrollTo(0, 0);
    });
    window.addEventListener('hashchange', show);
  }
  show();
});

</script>
</head>

<x-dc></x-dc>
</body>
