<style>*{box-sizing:border-box}body{margin:0;background:#dfeae5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:70px;padding:48px}.copy{width:340px}.index{font:800 11px ui-monospace,monospace;letter-spacing:.14em;color:#f06d49}.copy h1{font:500 49px/1.01 Georgia,serif;letter-spacing:-.045em;color:#153d38;margin:10px 0 14px}.copy p{font-size:15px;line-height:1.6;color:#536a65}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}.tags span{border:1px solid #9fb5ae;border-radius:99px;padding:7px 10px;color:#49615b;font-size:11px}.phoneScale{transform:scale(.78);transform-origin:center}</style></head><body><div id="root"></div><script type="text/babel">

function IosFrame({children,width=393,height=852,time='9:41',battery=87}){return <div style={iosFrameStyles.wrapper}><div style={{...iosFrameStyles.screen,width,height}}><div style={{...iosFrameStyles.statusBar,color:'#153d38'}}><span>{time}</span><div style={iosFrameStyles.statusIcons}><div style={iosFrameStyles.signalIcon}>{[4,6,9,11].map((h,i)=><div key={i} style={{...iosFrameStyles.signalBar,height:h}}/>)}</div><svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/><path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/><path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" opacity=".7"/></svg><div style={iosFrameStyles.batteryIcon}><div style={{width:battery+'%',height:'100%',background:'currentColor',borderRadius:1}}/><div style={iosFrameStyles.batteryCap}/></div></div></div><div style={iosFrameStyles.dynamicIsland}/><div style={iosFrameStyles.content}>{children}</div><div style={iosFrameStyles.homeIndicator}/></div></div>}
function TailApp(){const c={bg:'#f5f8ed',ink:'#153d38',forest:'#246a5a',mint:'#a9dbc9',orange:'#f06d49',blue:'#75b8d8',paper:'#fffef9',line:'#cbdcd4'};return <div style={{height:'100%',background:c.bg,color:c.ink,padding:'12px 18px 0',overflow:'hidden'}}>
 <header style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><div><span style={{font:'800 9px ui-monospace,monospace',letterSpacing:'.12em',color:c.orange}}>SUNDAY · 09:30</span><div style={{font:'600 16px Georgia,serif'}}>Milo’s day</div></div><button style={{width:38,height:38,border:'1px solid '+c.line,borderRadius:'45% 55% 45% 55%',background:c.paper,color:c.forest,fontWeight:900}}>＋</button></header>
 <section style={{height:157,margin:'13px -18px 0',padding:'12px 18px 14px',background:c.mint,borderRadius:'0 0 46% 10%',position:'relative',overflow:'hidden'}}><div style={{font:'500 31px/1.02 Georgia,serif',letterSpacing:'-.04em'}}>A calm morning,<br/><i>with two bright moments.</i></div><p style={{fontSize:10,margin:'8px 0 0',opacity:.65}}>30-minute video reviewed</p><div style={{position:'absolute',right:-5,bottom:-31,width:128,height:128,borderRadius:'50%',background:c.paper,padding:6,boxShadow:'0 8px 20px rgba(21,61,56,.12)'}}><img src="assets/demo-feeding-frame.png" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}}/></div><div style={{position:'absolute',right:93,bottom:23,width:34,height:34,borderRadius:'50%',background:c.orange,color:'#fff',display:'grid',placeItems:'center',fontSize:13}}>▶</div></section>
 <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',margin:'14px 0 9px'}}><b style={{font:'600 17px Georgia,serif'}}>Follow the trail</b><span style={{fontSize:9,opacity:.5}}>09:00 — 09:30</span></div>
 <section style={{height:286,background:c.paper,borderRadius:'30px 18px 30px 18px',border:'1px solid '+c.line,position:'relative',overflow:'hidden'}}>
  <div style={{position:'absolute',left:88,top:24,width:138,height:214,border:'4px solid '+c.mint,borderLeftColor:'transparent',borderBottomColor:'transparent',borderRadius:'50%',transform:'rotate(23deg)'}}/><div style={{position:'absolute',left:158,top:101,width:117,height:119,border:'4px solid '+c.mint,borderRightColor:'transparent',borderTopColor:'transparent',borderRadius:'50%',transform:'rotate(-18deg)'}}/>
  {[{x:43,y:34,t:'09:00',l:'Resting',col:c.blue},{x:170,y:63,t:'09:08',l:'Feeding',col:c.orange},{x:80,y:160,t:'09:18',l:'Play together',col:c.forest},{x:184,y:190,t:'09:22',l:'Resting',col:c.blue}].map((e,i)=><div key={e.t+e.l} style={{position:'absolute',left:e.x,top:e.y,display:'flex',gap:8,alignItems:'center',flexDirection:i%2?'row-reverse':'row'}}><div style={{width:i===1?48:36,height:i===1?48:36,borderRadius:'50% 45% 48% 43%',background:e.col,border:'4px solid '+c.paper,boxShadow:'0 3px 10px rgba(0,0,0,.13)',color:'#fff',display:'grid',placeItems:'center',fontSize:i===1?14:10,fontWeight:900}}>{i===1?'▶':'•'}</div><div style={{background:i===1?c.orange:c.paper,color:i===1?'#fff':c.ink,border:i===1?0:'1px solid '+c.line,borderRadius:13,padding:'7px 9px',minWidth:i===1?112:86,boxShadow:i===1?'0 5px 12px rgba(240,109,73,.24)':'none'}}><b style={{display:'block',fontSize:10}}>{e.l}</b><span style={{fontSize:8,opacity:.65}}>{e.t}{i===1?'–09:10':''}</span></div></div>)}
  <div style={{position:'absolute',left:17,bottom:13,right:17,display:'flex',gap:6}}>{[['REST','19m',c.blue],['ACTIVE','11m',c.forest],['TOGETHER','5m',c.orange]].map(([a,b,col])=><div key={a} style={{flex:1,borderTop:'3px solid '+col,paddingTop:5}}><span style={{fontSize:7,opacity:.5}}>{a}</span><b style={{display:'block',font:'600 15px Georgia,serif'}}>{b}</b></div>)}</div>
 </section>
 <div style={{marginTop:12,background:c.forest,color:'#fff',borderRadius:'22px 22px 8px 22px',padding:'13px 14px',display:'flex',alignItems:'center',gap:10}}><div style={{width:38,height:38,borderRadius:'50%',background:c.orange,display:'grid',placeItems:'center'}}>▶</div><div style={{flex:1}}><b style={{display:'block',fontSize:12}}>Eating while being fed</b><span style={{fontSize:9,opacity:.68}}>09:08–09:10 · Human + dog</span></div><span style={{fontSize:18}}>›</span></div>
 <nav style={{height:61,margin:'12px -18px 0',padding:'0 27px',background:c.paper,borderTop:'1px solid '+c.line,display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:9}}><b style={{color:c.forest}}>●<br/>Trail</b><span>▣<br/>Clips</span><span>○<br/>Milo</span></nav>
 </div>}
function App(){return <main className="page"><section className="copy"><div className="index">DIRECTION 02 · TAIL TRAIL</div><h1>Follow the shape of Milo’s day.</h1><p>The timeline becomes a gently curving trail, with detected moments acting like stops on a walk. It feels more pet-specific without sacrificing chronological meaning.</p><div className="tags"><span>tail-like timeline</span><span>pet portrait anchor</span><span>guided story</span></div></section><div className="phoneScale"><IosFrame><TailApp/></IosFrame></div></main>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
