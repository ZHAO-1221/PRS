<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iOS Color Directions — Pet Activity Review</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#e9e8e4;color:#1d2421;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    .board{min-height:100vh;padding:42px 42px 52px}
    .board-head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;max-width:1850px;margin:0 auto 28px}
    .eyebrow{font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:#6d716e}
    h1{font-family:Iowan Old Style,"Palatino Linotype",Georgia,serif;font-size:38px;line-height:1.08;font-weight:500;letter-spacing:-.025em;margin:7px 0 8px}
    .subtitle{margin:0;color:#646965;font-size:14px}
    .note{max-width:490px;font-size:12px;line-height:1.5;color:#6a6f6b;text-align:right}
    .options{max-width:1850px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(280px,1fr));gap:18px}
    .option{background:#f7f7f4;border:1px solid rgba(37,44,40,.1);padding:18px 18px 16px;min-width:0}
    .option.recommended{box-shadow:inset 0 3px 0 var(--primary)}
    .option-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:13px}
    .option-index{font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#818681}
    .option h2{font-family:Iowan Old Style,"Palatino Linotype",Georgia,serif;font-size:22px;font-weight:500;line-height:1.1;margin:5px 0 4px;color:#222824}
    .option-desc{font-size:11px;line-height:1.42;color:#747974;max-width:250px}
    .badge{white-space:nowrap;border:1px solid var(--primary);color:var(--primary);padding:5px 7px;font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .phone-stage{height:505px;position:relative;overflow:hidden;background:linear-gradient(180deg,#e5e6e1,#d7d9d4);display:flex;justify-content:center;align-items:flex-start;padding-top:14px}
    .phone-scale{transform:scale(.555);transform-origin:top center}
    .swatches{display:grid;grid-template-columns:repeat(6,1fr);height:25px;margin-top:13px;border:1px solid rgba(0,0,0,.07)}
    .hexes{display:flex;justify-content:space-between;gap:5px;margin-top:7px;color:#777d78;font:8px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace}
    .use{margin:10px 0 0;color:#4f5551;font-size:10px;line-height:1.45}
    @media(max-width:1250px){.options{grid-template-columns:repeat(2,minmax(300px,1fr))}.note{display:none}}
    @media(max-width:680px){.board{padding:26px 14px}.options{grid-template-columns:1fr}.board-head{display:block}h1{font-size:31px}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const iosFrameStyles = {
      wrapper:{display:'inline-block',padding:12,background:'#000',borderRadius:60,boxShadow:'0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,.3)',position:'relative'},
      screen:{position:'relative',borderRadius:48,overflow:'hidden',background:'#fff'},
      statusBar:{position:'absolute',top:0,left:0,right:0,height:54,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 32px',fontSize:16,fontWeight:600,fontFamily:'-apple-system,"SF Pro Text",sans-serif',zIndex:20,pointerEvents:'none'},
      dynamicIsland:{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',width:124,height:36,background:'#000',borderRadius:999,zIndex:30},
      statusIcons:{display:'flex',alignItems:'center',gap:6},signalIcon:{display:'flex',alignItems:'flex-end',gap:2,height:12},signalBar:{width:3,background:'currentColor',borderRadius:1},
      batteryIcon:{width:26,height:12,border:'1.5px solid currentColor',borderRadius:3,padding:1,position:'relative',opacity:.8},batteryCap:{position:'absolute',top:3,right:-3,width:2,height:6,background:'currentColor',borderRadius:'0 1px 1px 0'},
      content:{position:'absolute',top:54,left:0,right:0,bottom:34,overflow:'hidden'},homeIndicator:{position:'absolute',bottom:10,left:'50%',transform:'translateX(-50%)',width:140,height:5,background:'rgba(0,0,0,.3)',borderRadius:999,zIndex:10}
    };
    function IosFrame({children,width=393,height=852,time='9:41',battery=87}){
      return <div style={iosFrameStyles.wrapper}><div style={{...iosFrameStyles.screen,width,height}}>
        <div style={{...iosFrameStyles.statusBar,color:'#000'}}><span>{time}</span><div style={iosFrameStyles.statusIcons}><div style={iosFrameStyles.signalIcon}>{[4,6,9,11].map((h,i)=><div key={i} style={{...iosFrameStyles.signalBar,height:h}}/>)}</div><svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/><path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/><path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" opacity=".7"/></svg><div style={iosFrameStyles.batteryIcon}><div style={{width:battery+'%',height:'100%',background:'currentColor',borderRadius:1}}/><div style={iosFrameStyles.batteryCap}/></div></div></div>
        <div style={iosFrameStyles.dynamicIsland}/><div style={iosFrameStyles.content}>{children}</div><div style={iosFrameStyles.homeIndicator}/>
      </div></div>
    }

    const palettes=[
      {id:'A',name:'Juniper & Apricot',tag:'Recommended',desc:'Warm, calm and recognizably pet-care without becoming childish.',bg:'#F3F5F0',surface:'#FFFFFF',ink:'#172820',primary:'#2F6653',accent:'#E0835E',soft:'#A9C2B5',line:'#D7E0D8',use:'Best balance of care, trust and friendly interaction.'},
      {id:'B',name:'Atlantic & Poppy',desc:'Cooler and more technical; feels like an intelligent home-camera companion.',bg:'#F1F5F6',surface:'#FFFFFF',ink:'#152B33',primary:'#2D6675',accent:'#DD6A58',soft:'#9BC1CA',line:'#D5E2E5',use:'Best if recognition accuracy and video intelligence lead the story.'},
      {id:'C',name:'Mulberry & Moss',desc:'Editorial and distinctive, with a softer lifestyle character.',bg:'#F6F1F2',surface:'#FFFCFC',ink:'#30252E',primary:'#66435D',accent:'#7C8F67',soft:'#C99AAA',line:'#E3D8DD',use:'Best if the app should feel like a personal pet journal.'},
      {id:'D',name:'Midnight & Marigold',desc:'Premium, composed and high-contrast, with a focused golden signal color.',bg:'#F3F3EE',surface:'#FFFFFF',ink:'#1E2927',primary:'#263E3A',accent:'#D2A13A',soft:'#88A39D',line:'#D9DDD8',use:'Best if you want a more serious monitoring-product impression.'}
    ];

    function MiniScreen({p}){
      const css={
        app:{height:'100%',background:p.bg,color:p.ink,padding:'14px 18px 0',fontFamily:'-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif'},
        top:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12},logo:{fontFamily:'Iowan Old Style,Georgia,serif',fontSize:18,fontWeight:650},avatar:{width:31,height:31,borderRadius:'50%',background:p.primary,color:'#fff',display:'grid',placeItems:'center',fontSize:11,fontWeight:800},
        kicker:{fontSize:10,fontWeight:750,letterSpacing:'.11em',textTransform:'uppercase',color:p.primary},title:{fontFamily:'Iowan Old Style,Georgia,serif',fontSize:29,lineHeight:1.05,fontWeight:500,letterSpacing:'-.03em',margin:'5px 0 4px'},sub:{fontSize:11,color:p.ink,opacity:.58,marginBottom:13},
        video:{height:190,borderRadius:22,overflow:'hidden',position:'relative',background:p.primary},image:{width:'100%',height:'100%',objectFit:'cover',display:'block'},shade:{position:'absolute',inset:'45% 0 0',background:'linear-gradient(transparent,rgba(8,16,13,.75))'},videoText:{position:'absolute',left:15,bottom:14,color:'#fff'},time:{fontSize:10,opacity:.8},activity:{fontFamily:'Iowan Old Style,Georgia,serif',fontSize:20,marginTop:2},play:{position:'absolute',right:15,bottom:15,width:35,height:35,borderRadius:'50%',border:0,background:p.accent,color:p.id==='D'?p.ink:'#fff',fontSize:13},
        statrow:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:7,margin:'10px 0'},stat:{background:p.surface,borderRadius:15,padding:'10px 9px',border:'1px solid '+p.line},statlabel:{fontSize:8,textTransform:'uppercase',letterSpacing:'.05em',opacity:.5},statval:{fontFamily:'Iowan Old Style,Georgia,serif',fontSize:18,marginTop:3},
        story:{background:p.surface,border:'1px solid '+p.line,borderRadius:19,padding:'13px 12px'},storyhead:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12},storytitle:{fontSize:13,fontWeight:750},storyrange:{fontSize:9,opacity:.45},laneLabel:{display:'grid',gridTemplateColumns:'52px 1fr',gap:8,alignItems:'center',margin:'7px 0'},laneName:{fontSize:9,opacity:.55},track:{height:18,background:p.bg,borderRadius:10,position:'relative',overflow:'hidden'},seg1:{position:'absolute',left:'4%',width:'29%',height:'100%',borderRadius:10,background:p.soft},seg2:{position:'absolute',left:'38%',width:'22%',height:'100%',borderRadius:10,background:p.primary},seg3:{position:'absolute',left:'64%',width:'31%',height:'100%',borderRadius:10,background:p.soft},int1:{position:'absolute',left:'38%',width:'16%',height:'100%',borderRadius:10,background:p.accent},int2:{position:'absolute',left:'69%',width:'20%',height:'100%',borderRadius:10,background:p.accent},
        selected:{display:'flex',alignItems:'center',gap:10,marginTop:10,paddingTop:10,borderTop:'1px solid '+p.line},dot:{width:8,height:8,borderRadius:'50%',background:p.accent},selectedText:{fontSize:11,fontWeight:700,flex:1},clip:{fontSize:9,color:p.primary,fontWeight:800},
        tabs:{height:58,margin:'11px -18px 0',padding:'8px 28px 0',borderTop:'1px solid '+p.line,display:'flex',justifyContent:'space-between',background:p.surface},tab:{fontSize:9,textAlign:'center',color:p.ink,opacity:.38},active:{color:p.primary,opacity:1,fontWeight:750},glyph:{fontSize:17,display:'block',lineHeight:1.1}
      };
      return <div style={css.app}>
        <div style={css.top}><div style={css.logo}>Petday</div><div style={css.avatar}>M</div></div>
        <div style={css.kicker}>Video analysis complete</div><div style={css.title}>Milo’s morning</div><div style={css.sub}>30 minutes reviewed · 09:00–09:30</div>
        <div style={css.video}><img style={css.image} src="assets/demo-feeding-frame.png"/><div style={css.shade}/><div style={css.videoText}><div style={css.time}>09:08–09:10</div><div style={css.activity}>Eating while being fed</div></div><button style={css.play}>▶</button></div>
        <div style={css.statrow}><div style={css.stat}><div style={css.statlabel}>Rest</div><div style={css.statval}>19m</div></div><div style={css.stat}><div style={css.statlabel}>Active</div><div style={css.statval}>11m</div></div><div style={css.stat}><div style={css.statlabel}>Together</div><div style={{...css.statval,color:p.accent}}>5m</div></div></div>
        <div style={css.story}><div style={css.storyhead}><span style={css.storytitle}>Activity timeline</span><span style={css.storyrange}>09:00 — 09:30</span></div><div style={css.laneLabel}><span style={css.laneName}>DOG</span><div style={css.track}><i style={css.seg1}/><i style={css.seg2}/><i style={css.seg3}/></div></div><div style={css.laneLabel}><span style={css.laneName}>TOGETHER</span><div style={css.track}><i style={css.int1}/><i style={css.int2}/></div></div><div style={css.selected}><i style={css.dot}/><span style={css.selectedText}>Feeding · 2 min</span><span style={css.clip}>PLAY CLIP →</span></div></div>
        <div style={css.tabs}><div style={{...css.tab,...css.active}}><span style={css.glyph}>▣</span>Review</div><div style={css.tab}><span style={css.glyph}>⌁</span>Videos</div><div style={css.tab}><span style={css.glyph}>○</span>Profile</div></div>
      </div>
    }

    function Option({p}){
      return <article className={'option '+(p.tag?'recommended':'')} style={{'--primary':p.primary}}><div className="option-head"><div><div className="option-index">OPTION {p.id}</div><h2>{p.name}</h2><div className="option-desc">{p.desc}</div></div>{p.tag&&<span className="badge">{p.tag}</span>}</div><div className="phone-stage"><div className="phone-scale"><IosFrame><MiniScreen p={p}/></IosFrame></div></div><div className="swatches">{[p.bg,p.surface,p.ink,p.primary,p.accent,p.soft].map(c=><i key={c} style={{background:c}}/>)}</div><div className="hexes"><span>{p.primary}</span><span>{p.accent}</span><span>{p.bg}</span></div><p className="use">{p.use}</p></article>
    }
    function App(){return <main className="board"><header className="board-head"><div><div className="eyebrow">iOS color study · Direction B revision</div><h1>Four calmer ways to tell the same story.</h1><p className="subtitle">Identical layout and content; only the color system changes.</p></div><div className="note">Color remains semantic: muted tone = dog activity, accent = human–dog interaction, deep primary = actions and selection. Red stays reserved for errors or urgent events.</div></header><section className="options">{palettes.map(p=><Option key={p.id} p={p}/>)}</section></main>}
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
