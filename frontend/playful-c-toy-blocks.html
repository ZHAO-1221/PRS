<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playful C — Toy Blocks</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#e9e4fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:70px;padding:48px}.copy{width:340px}.index{font:800 11px ui-monospace,monospace;letter-spacing:.14em;color:#ea604e}.copy h1{font:900 45px/.98 "Avenir Next Rounded","Arial Rounded MT Bold",sans-serif;letter-spacing:-.055em;text-transform:uppercase;color:#20253b;margin:10px 0 14px}.copy p{font-size:15px;line-height:1.6;color:#5a5e74}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}.tags span{border:1px solid #aaa7c7;border-radius:99px;padding:7px 10px;color:#53546c;font-size:11px}.phoneScale{transform:scale(.78);transform-origin:center}</style></head><body><div id="root"></div><script type="text/babel">
const iosFrameStyles={wrapper:{display:'inline-block',padding:12,background:'#000',borderRadius:60,boxShadow:'0 0 0 2px #1f2937,0 20px 60px rgba(0,0,0,.3)',position:'relative'},screen:{position:'relative',borderRadius:48,overflow:'hidden',background:'#fff'},statusBar:{position:'absolute',top:0,left:0,right:0,height:54,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 32px',fontSize:16,fontWeight:600,fontFamily:'-apple-system,"SF Pro Text",sans-serif',zIndex:20,pointerEvents:'none'},dynamicIsland:{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',width:124,height:36,background:'#000',borderRadius:999,zIndex:30},statusIcons:{display:'flex',alignItems:'center',gap:6},signalIcon:{display:'flex',alignItems:'flex-end',gap:2,height:12},signalBar:{width:3,background:'currentColor',borderRadius:1},batteryIcon:{width:26,height:12,border:'1.5px solid currentColor',borderRadius:3,padding:1,position:'relative',opacity:.8},batteryCap:{position:'absolute',top:3,right:-3,width:2,height:6,background:'currentColor',borderRadius:'0 1px 1px 0'},content:{position:'absolute',top:54,left:0,right:0,bottom:34,overflow:'hidden'},homeIndicator:{position:'absolute',bottom:10,left:'50%',transform:'translateX(-50%)',width:140,height:5,background:'rgba(0,0,0,.3)',borderRadius:999,zIndex:10}};
function IosFrame({children,width=393,height=852,time='9:41',battery=87}){return <div style={iosFrameStyles.wrapper}><div style={{...iosFrameStyles.screen,width,height}}><div style={{...iosFrameStyles.statusBar,color:'#20253b'}}><span>{time}</span><div style={iosFrameStyles.statusIcons}><div style={iosFrameStyles.signalIcon}>{[4,6,9,11].map((h,i)=><div key={i} style={{...iosFrameStyles.signalBar,height:h}}/>)}</div><svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/><path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/><path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" opacity=".7"/></svg><div style={iosFrameStyles.batteryIcon}><div style={{width:battery+'%',height:'100%',background:'currentColor',borderRadius:1}}/><div style={iosFrameStyles.batteryCap}/></div></div></div><div style={iosFrameStyles.dynamicIsland}/><div style={iosFrameStyles.content}>{children}</div><div style={iosFrameStyles.homeIndicator}/></div></div>}
function Paw({color='#20253b',size=24}){return <span style={{width:size,height:size,display:'inline-block',position:'relative'}}><i style={{position:'absolute',width:'44%',height:'40%',borderRadius:'55% 55% 45% 45%',background:color,left:'28%',bottom:'6%'}}/>{[[5,8],[36,0],[66,8]].map((p,i)=><i key={i} style={{position:'absolute',width:'24%',height:'28%',borderRadius:'50%',background:color,left:p[0]+'%',top:p[1]+'%'}}/>)}</span>}
function ToyApp(){const c={bg:'#fffaf0',ink:'#20253b',blue:'#3156d9',yellow:'#ffe269',coral:'#ef654f',mint:'#a9e4cb',lav:'#c9bdf4',paper:'#fffdf8'};return <div style={{height:'100%',background:c.bg,color:c.ink,padding:'12px 17px 0',overflow:'hidden'}}>
 <header style={{height:44,display:'flex',justifyContent:'space-between',alignItems:'center'}}><b style={{font:'900 13px "Avenir Next Rounded",sans-serif'}}>MILO CAM</b><div style={{display:'flex',gap:5}}>{[c.blue,c.yellow,c.coral].map(x=><i key={x} style={{width:9,height:9,borderRadius:'50%',background:x}}/>)}</div></header>
 <section style={{background:c.blue,color:'#fff',border:'3px solid '+c.ink,borderRadius:'27px 10px 27px 10px',padding:'15px 15px 13px',position:'relative',boxShadow:'5px 5px 0 '+c.ink}}><span style={{font:'900 9px ui-monospace,monospace',letterSpacing:'.12em',color:c.yellow}}>VIDEO COMPLETE!</span><h2 style={{font:'900 31px/.96 "Avenir Next Rounded","Arial Rounded MT Bold",sans-serif',letterSpacing:'-.045em',margin:'5px 0 8px'}}>GOOD MORNING,<br/>MILO!</h2><p style={{fontSize:10,margin:0,opacity:.8}}>We found 8 moments in 30 minutes.</p><div style={{position:'absolute',right:12,top:13,width:58,height:58,borderRadius:'50%',background:c.yellow,border:'3px solid '+c.ink,display:'grid',placeItems:'center',transform:'rotate(9deg)'}}><Paw color={c.ink} size={30}/></div></section>
 <div style={{marginTop:14,height:207,border:'3px solid '+c.ink,borderRadius:'12px 28px 12px 28px',overflow:'hidden',position:'relative',background:c.ink}}><img src="assets/demo-feeding-frame.png" style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/><div style={{position:'absolute',inset:'46% 0 0',background:'linear-gradient(transparent,rgba(20,24,35,.78))'}}/><div style={{position:'absolute',left:13,bottom:13,color:'#fff'}}><span style={{fontSize:9,color:c.yellow,fontWeight:900}}>09:08 — 09:10</span><b style={{display:'block',fontSize:15,marginTop:2}}>Eating while being fed</b></div><button style={{position:'absolute',right:13,bottom:12,width:44,height:44,borderRadius:'50%',border:'3px solid '+c.ink,background:c.coral,color:'#fff',fontSize:16}}>▶</button></div>
 <div style={{display:'grid',gridTemplateColumns:'1.2fr .9fr .9fr',gap:8,marginTop:10}}>{[['REST','19 MIN',c.mint],['MOVE','11',c.yellow],['TOGETHER','5',c.lav]].map(([a,b,col],i)=><div key={a} style={{height:69,background:col,border:'2px solid '+c.ink,borderRadius:i===0?'20px 9px 9px 20px':'10px',padding:'9px 10px',boxShadow:'3px 3px 0 '+c.ink}}><span style={{fontSize:8,fontWeight:900}}>{a}</span><b style={{display:'block',font:'900 19px "Avenir Next Rounded",sans-serif',marginTop:2}}>{b}</b></div>)}</div>
 <section style={{marginTop:12}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><b style={{font:'900 13px "Avenir Next Rounded",sans-serif'}}>THE 30-MINUTE MIX</b><span style={{fontSize:8,opacity:.55}}>TAP A BLOCK</span></div><div style={{height:58,display:'flex',gap:4,alignItems:'stretch',marginTop:8}}>{[[18,c.mint,'REST'],[13,c.blue,'WALK'],[10,c.coral,'FEED'],[22,c.lav,'SLEEP'],[15,c.yellow,'PLAY'],[22,c.mint,'REST']].map(([w,col,l],i)=><div key={i} style={{width:w+'%',background:col,border:'2px solid '+c.ink,borderRadius:i%2?'14px 7px':'7px 14px',display:'grid',placeItems:'center',overflow:'hidden'}}><span style={{fontSize:7,fontWeight:950,transform:'rotate(-90deg)',whiteSpace:'nowrap'}}>{l}</span></div>)}</div></section>
 <button style={{width:'100%',height:54,marginTop:12,border:'3px solid '+c.ink,borderRadius:'30px 12px 30px 12px',background:c.coral,color:'#fff',fontWeight:950,boxShadow:'4px 4px 0 '+c.ink,display:'flex',alignItems:'center',justifyContent:'center',gap:10}}><span style={{background:c.yellow,color:c.ink,borderRadius:'50%',width:28,height:28,display:'grid',placeItems:'center'}}>▶</span>PLAY FEEDING CLIP</button>
 <nav style={{height:61,margin:'13px -17px 0',padding:'0 28px',background:c.paper,borderTop:'2px solid '+c.ink,display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:9}}><b style={{color:c.blue}}>▣<br/>Review</b><span>▶<br/>Clips</span><span>○<br/>Milo</span></nav>
 </div>}
function App(){return <main className="page"><section className="copy"><div className="index">DIRECTION 03 · TOY BLOCKS</div><h1>Bright, chunky, unmistakably dog.</h1><p>Solid toy-like colors, bold outlines and activity blocks give the product a memorable identity. The energy is higher, while the timeline still reads as a precise sequence.</p><div className="tags"><span>chew-toy color</span><span>chunky modules</span><span>bold personality</span></div></section><div className="phoneScale"><IosFrame><ToyApp/></IosFrame></div></main>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
