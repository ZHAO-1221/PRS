<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playful A — Sticker Story</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#eee9df;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:70px;padding:48px}.copy{width:340px}.index{font:800 11px ui-monospace,monospace;letter-spacing:.14em;color:#ef624f}.copy h1{font:700 46px/1.02 "Avenir Next Rounded","Arial Rounded MT Bold",sans-serif;letter-spacing:-.04em;color:#19384a;margin:10px 0 14px}.copy p{font-size:15px;line-height:1.6;color:#5e6a6b}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}.tags span{border:1px solid #bdc4bf;border-radius:99px;padding:7px 10px;color:#56615d;font-size:11px}.phoneScale{transform:scale(.78);transform-origin:center}</style></head><body><div id="root"></div><script type="text/babel">
const iosFrameStyles={wrapper:{display:'inline-block',padding:12,background:'#000',borderRadius:60,boxShadow:'0 0 0 2px #1f2937,0 20px 60px rgba(0,0,0,.3)',position:'relative'},screen:{position:'relative',borderRadius:48,overflow:'hidden',background:'#fff'},statusBar:{position:'absolute',top:0,left:0,right:0,height:54,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 32px',fontSize:16,fontWeight:600,fontFamily:'-apple-system,"SF Pro Text",sans-serif',zIndex:20,pointerEvents:'none'},dynamicIsland:{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',width:124,height:36,background:'#000',borderRadius:999,zIndex:30},statusIcons:{display:'flex',alignItems:'center',gap:6},signalIcon:{display:'flex',alignItems:'flex-end',gap:2,height:12},signalBar:{width:3,background:'currentColor',borderRadius:1},batteryIcon:{width:26,height:12,border:'1.5px solid currentColor',borderRadius:3,padding:1,position:'relative',opacity:.8},batteryCap:{position:'absolute',top:3,right:-3,width:2,height:6,background:'currentColor',borderRadius:'0 1px 1px 0'},content:{position:'absolute',top:54,left:0,right:0,bottom:34,overflow:'hidden'},homeIndicator:{position:'absolute',bottom:10,left:'50%',transform:'translateX(-50%)',width:140,height:5,background:'rgba(0,0,0,.3)',borderRadius:999,zIndex:10}};
function IosFrame({children,width=393,height=852,time='9:41',battery=87}){return <div style={iosFrameStyles.wrapper}><div style={{...iosFrameStyles.screen,width,height}}><div style={{...iosFrameStyles.statusBar,color:'#19384a'}}><span>{time}</span><div style={iosFrameStyles.statusIcons}><div style={iosFrameStyles.signalIcon}>{[4,6,9,11].map((h,i)=><div key={i} style={{...iosFrameStyles.signalBar,height:h}}/>)}</div><svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/><path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/><path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" opacity=".7"/></svg><div style={iosFrameStyles.batteryIcon}><div style={{width:battery+'%',height:'100%',background:'currentColor',borderRadius:1}}/><div style={iosFrameStyles.batteryCap}/></div></div></div><div style={iosFrameStyles.dynamicIsland}/><div style={iosFrameStyles.content}>{children}</div><div style={iosFrameStyles.homeIndicator}/></div></div>}
function Paw({color='#ef624f',size=28}){return <span style={{width:size,height:size,display:'inline-block',position:'relative',transform:'rotate(-12deg)'}}><i style={{position:'absolute',width:'42%',height:'42%',borderRadius:'50% 50% 45% 45%',background:color,left:'29%',bottom:'4%'}}/>{[[5,6],[35,0],[61,7],[75,30]].map((p,i)=><i key={i} style={{position:'absolute',width:'24%',height:'27%',borderRadius:'50%',background:color,left:p[0]+'%',top:p[1]+'%'}}/>)}</span>}
function StickerApp(){const c={cream:'#fff8e9',paper:'#fffdf8',ink:'#19384a',coral:'#ef624f',aqua:'#6dc8c6',yellow:'#ffd45c',line:'#d9ddcf'};return <div style={{height:'100%',background:c.cream,color:c.ink,padding:'13px 18px 0',position:'relative',overflow:'hidden'}}>
 <div style={{position:'absolute',right:-12,top:95,opacity:.09,transform:'rotate(20deg)'}}><Paw color={c.coral} size={84}/></div>
 <header style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><div style={{font:'800 14px "Avenir Next Rounded",sans-serif',letterSpacing:'.04em'}}>ACTIVITY REVIEW</div><div style={{width:36,height:36,borderRadius:'50%',background:c.yellow,display:'grid',placeItems:'center'}}><Paw color={c.ink} size={18}/></div></header>
 <section style={{marginTop:15}}><div style={{font:'800 10px ui-monospace,monospace',letterSpacing:'.12em',color:c.coral}}>ANALYSIS COMPLETE</div><h2 style={{font:'800 34px/1 "Avenir Next Rounded","Arial Rounded MT Bold",sans-serif',letterSpacing:'-.045em',margin:'5px 0 5px'}}>Milo’s little<br/>morning story</h2><p style={{fontSize:11,margin:0,opacity:.58}}>30 minutes · Sunday · 09:00–09:30</p></section>
 <div style={{margin:'17px 8px 0',background:c.paper,padding:8,borderRadius:18,boxShadow:'0 10px 0 rgba(25,56,74,.09)',transform:'rotate(-1.5deg)',position:'relative'}}><img src="assets/demo-feeding-frame.png" style={{display:'block',width:'100%',height:198,objectFit:'cover',borderRadius:12}}/><div style={{position:'absolute',left:18,bottom:17,background:c.paper,borderRadius:10,padding:'8px 10px',boxShadow:'0 3px 10px rgba(0,0,0,.14)'}}><b style={{display:'block',fontSize:13}}>Eating while being fed</b><span style={{fontSize:9,opacity:.55}}>09:08–09:10 · 2 min</span></div><button style={{position:'absolute',right:17,bottom:17,width:42,height:42,border:0,borderRadius:'50%',background:c.coral,color:'#fff',fontSize:15}}>▶</button><span style={{position:'absolute',right:21,top:-16,background:c.yellow,border:'2px solid '+c.ink,borderRadius:99,padding:'7px 9px',fontSize:9,fontWeight:900,transform:'rotate(6deg)'}}>PLAY ME</span></div>
 <div style={{display:'flex',gap:8,margin:'18px 0 12px'}}>{[['REST','19m',c.aqua],['ACTIVE','11m',c.yellow],['TOGETHER','5m',c.coral]].map(([a,b,col],i)=><div key={a} style={{flex:1,background:col,borderRadius:i===1?'18px 18px 8px 18px':'18px',padding:'10px 9px',color:i===0?c.ink:(i===2?'#fff':c.ink),transform:'rotate('+(i-1)*1.5+'deg)'}}><span style={{fontSize:8,fontWeight:850,letterSpacing:'.08em'}}>{a}</span><strong style={{display:'block',font:'800 20px "Avenir Next Rounded",sans-serif',marginTop:2}}>{b}</strong></div>)}</div>
 <div style={{background:c.paper,borderRadius:20,padding:'13px 13px 15px',border:'1px solid '+c.line}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><b style={{fontSize:13}}>Today’s stickers</b><span style={{fontSize:9,opacity:.5}}>TAP TO PLAY</span></div><div style={{position:'relative',height:66,marginTop:8}}><div style={{position:'absolute',left:4,right:4,top:31,borderTop:'2px dashed '+c.aqua}}/>{[['09:00','Resting',4,c.aqua],['09:08','Feeding',34,c.coral],['09:18','Play',65,c.yellow]].map(([t,l,x,col])=><div key={l} style={{position:'absolute',left:x+'%',top:5,transform:'translateX(-50%) rotate('+(x%2?2:-2)+'deg)',textAlign:'center'}}><div style={{width:35,height:35,borderRadius:11,background:col,border:'3px solid '+c.paper,boxShadow:'0 2px 6px rgba(0,0,0,.12)',display:'grid',placeItems:'center'}}><Paw color={col===c.coral?'#fff':c.ink} size={17}/></div><span style={{fontSize:8,fontWeight:800}}>{t}</span></div>)}</div></div>
 <nav style={{height:62,margin:'12px -18px 0',background:c.paper,borderTop:'1px solid '+c.line,display:'flex',justifyContent:'space-around',alignItems:'center',fontSize:9}}><b style={{color:c.coral}}>●<br/>Story</b><span>▣<br/>Videos</span><span>○<br/>Milo</span></nav>
 </div>}
function App(){return <main className="page"><section className="copy"><div className="index">DIRECTION 01 · STICKER STORY</div><h1>A video report you want to keep.</h1><p>Detected moments become tactile “stickers” rather than rows in a report. Paw stamps, slight rotation and physical layering add personality while timestamps remain explicit.</p><div className="tags"><span>scrapbook warmth</span><span>clip stickers</span><span>paw progress</span></div></section><div className="phoneScale"><IosFrame><StickerApp/></IosFrame></div></main>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
